<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MCQ Quiz App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- ================= TOP BAR ================= -->
      <div class="top-bar">
        <h1>MCQs Quiz</h1>

        <div class="right">
          <!-- Theme Change Button -->
          <button id="themeBtn">🌙</button>

          <!-- Quiz Timer -->
          <div id="timer">01:00</div>
        </div>
      </div>

      <!-- ================= QUIZ BOX ================= -->
      <div class="quiz-box">
        <!-- Question Counter -->
        <div id="questionCount"></div>

        <!-- Question -->
        <h2 id="question"></h2>

        <!-- Options will be created using JavaScript -->
        <div class="options" id="options"></div>
        <!-- Next Button -->
        <button id="nextBtn" onclick="next()">Next</button>
      </div>
    </div>

    <!-- JavaScript File -->
    <script src="app.js"></script>
  </body>
</html>
